# ============================================
# Backend CI — Brakeman / bundler-audit / RuboCop
# ============================================
# 経緯:
#   元ファイルは backend/.github/workflows/ci.yml に置かれていたが、
#   GitHub Actions はリポジトリ直下の .github/workflows/ のみ参照するため
#   一切実行されていなかった（ランダム性カオステストで R-1 として検出）。
#   本ファイルは元の挙動を維持しつつ、リポジトリ直下に移動した版。
#
# サブディレクトリ構成への対応:
#   - run: 系ステップは defaults.run.working-directory で backend/ に固定
#   - ruby/setup-ruby は working-directory パラメータを明示
#   - actions/cache / hashFiles は repo ルートからのパスなので backend/ プレフィックス必須
# ============================================

name: Backend CI

on:
  pull_request:
  push:
    branches: [main]

defaults:
  run:
    working-directory: backend

jobs:
  scan_ruby:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: backend

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('backend/.ruby-version', 'backend/**/.rubocop.yml', 'backend/**/.rubocop_todo.yml', 'backend/Gemfile.lock') }}
        with:
          path: backend/${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github
