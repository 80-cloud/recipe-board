name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@beta
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          model: "claude-sonnet-4-6"
          direct_prompt: |
            # PRレビュー

            このPRで変更されたファイルを確認し、以下の観点でレビューを実施してください。
            recipe-board は学習用レシピ管理アプリ（Ruby on Rails 8.x + Nuxt 3 + MySQL + AWS）です。
            プロジェクトの規約は CLAUDE.md と要件定義書を参照してください。

            ## レビュー手順

            ### ステップ1: 過去のレビュー確認（重複指摘の防止）
            1. このPRの過去のレビューコメントを確認
            2. 対応済みの項目は再指摘しない
            3. 新規変更または未対応の項目のみをレビュー対象とする

            ### ステップ2: 変更ファイルの理解
            - 変更の意図（新機能、バグ修正、リファクタリング等）
            - 影響範囲
            - PRの説明との整合性

            ### ステップ3: レビュー実施

            #### バックエンド (backend/**, *.rb) — Ruby on Rails の変更がある場合
            - [ ] Strong Parameters（`params.require(...).permit(...)`）でマスアサインメント脆弱性を防いでいるか
            - [ ] Active Record の SQL 構築で文字列補間ではなくプレースホルダ（`where("col = ?", val)`）を使っているか
            - [ ] CSRF 保護（`protect_from_forgery`）が有効か、API モードで CSRF トークン検証が必要な場面で省略していないか
            - [ ] 認証 / 認可（devise / Pundit / CanCanCan などの利用、または手書きでも漏れがないか）
            - [ ] N+1 クエリが発生する可能性がないか（`includes` / `preload` / `eager_load` の利用、bullet gem の警告）
            - [ ] 例外処理が `rescue_from` などで集約されているか
            - [ ] バリデーション（`validates`）が適切に設定されているか
            - [ ] secret / API key が credentials.yml.enc または環境変数で管理されているか（平文 YAML 禁止）
            - [ ] `before_action` の認証チェックが漏れているコントローラがないか
            - [ ] Rails の `safe_navigation`（`&.`）や `dig` を適切に使い NilClass エラーを防いでいるか

            #### フロントエンド (frontend/**, *.vue, *.ts, *.js) — Nuxt 3 の変更がある場合
            - [ ] Vue 3 Composition API の慣行に従っているか（`<script setup>`, `ref` / `reactive` の使い分け）
            - [ ] SSR / CSR の境界が明示的か（`useFetch` / `useAsyncData` / `useState` の正しい使い分け）
            - [ ] 状態管理（Pinia 等）の store が必要以上に肥大化していないか
            - [ ] XSS 対策: Vue の `v-html` は信頼できない入力に対して使っていないか（必要なら DOMPurify 経由）
            - [ ] フォームバリデーションが過不足なく実装されているか
            - [ ] API 呼び出しのエラーハンドリングが網羅されているか（401 / 403 / 404 / 500）
            - [ ] console.log がデバッグ用途で残っていないか
            - [ ] アクセシビリティ（alt 属性、ARIA、キーボード操作）の基本対応がされているか
            - [ ] Nuxt の auto-import に頼りすぎて読みづらくなっていないか

            #### インフラ (infra/**, *.tf) の変更がある場合
            - [ ] terraform fmt / validate が通る形式か
            - [ ] 平文の機密情報がコミットされていないか
            - [ ] `lifecycle { prevent_destroy = true }` が必要なリソース（RDS / S3 等）に付与されているか
            - [ ] 無料枠を超えるリソースタイプ（t2.micro 等）になっていないか（t3.micro 推奨）
            - [ ] `terraform plan` の差分に意図しない destroy が含まれる懸念がないか

            #### ドキュメント (docs/**, *.md) の変更がある場合
            - [ ] ドキュメント間の整合性が取れているか（要件定義書 / API 仕様書 / ER図 / 画面設計書）
            - [ ] Markdown フォーマットが正しいか
            - [ ] 内容が正確か（API パス、テーブル名、機能名）
            - [ ] リンク切れがないか

            #### ワークフロー (.github/**) の変更がある場合
            - [ ] YAML 構文が正しいか
            - [ ] パーミッション設定が最小権限の原則に従っているか
            - [ ] シークレットの取り扱いが適切か
            - [ ] アクションのバージョンが固定されているか
            - [ ] 既存ワークフロー（backend-ci.yml / frontend-ci.yml / gitleaks.yml / rds-auto-stop.yml）と競合しないか

            #### DB マイグレーション (db/migrate/**, *.rb) の変更がある場合
            - [ ] 既存データへの影響（NOT NULL 追加、型変更、index 追加）を考慮しているか
            - [ ] `change` vs `up/down` の使い分けが適切か（可逆性の確保）
            - [ ] 大きなテーブルへの index 追加で `algorithm: :concurrently` を検討しているか
            - [ ] ロールバック手順が明確か

            ### ステップ4: レビュー結果の出力

            **問題なしと判断した項目は出力しないでください。**
            実際に修正が必要な指摘事項、または改善提案がある項目のみ出力してください。

            #### フィードバック形式

            ##### 🔴 必須修正事項（優先度：高）
            セキュリティ脆弱性・本番事故につながる設計欠陥・認可漏れ・データ破壊リスクなど。

            ##### 🟡 推奨改善事項（優先度：中）
            バグ・パフォーマンス問題・命名規約違反など。

            ##### 🟢 軽微な提案（優先度：低）
            typo、表現改善、リファクタ案、テスト追加提案、学習価値のあるコメントなど。

            ##### ✨ 良い点 + 更なる改善 (トヨタ式 PDCAS — Standardize & Improve)
            良い実装・記述を発見したら、まず「なぜ良いか」を言語化する。そのうえで:
            - この良さをさらに伸ばすにはどうしたらよいか（改善案）
            - 標準化して他のファイル・他のプロジェクトに横展開できないか（標準化案）

            を必ず添えて評価する。単純な賞賛で終わらせず、良い実践を強化・拡張する視点で深掘りする。

            #### 注意事項
            - **日本語でフィードバックする**
            - **具体的で建設的な提案をする**
            - **調査した結果「問題なし」と判断した項目は出力しない**
            - **「重大」「🔴」等の重い言葉を乱発しない**
            - **学習用プロジェクトであることを踏まえ、過度に厳しい指摘は避ける**（教育的・建設的に）

          use_sticky_comment: true
