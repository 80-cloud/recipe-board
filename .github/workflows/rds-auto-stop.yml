name: RDS Auto Stop (recipe-board / 修練城整備 #4)

# ============================================
# scout-drone-protocol v3.4 適用 / 修練城整備 #4
# F3 解体パターン（task-board PR #61）の recipe-board 版横展開
# ============================================
# 目的:
#   AWS の仕様 = stopped RDS は 7 日後に自動再起動する。
#   これを阻止するため、5 日ごとに自動的に stop し直す。
#
# 関連:
#   - recipe-board#95: 本 workflow の Issue
#   - recipe-board#94: scout-drone-protocol v3.4
#   - 修練城整備 #4（運用穴 → 構造的対処）
#   - F3 達成 Level: L3（解体）
#
# 安全策:
#   - 専用 IAM user 推奨（最小権限: rds:StopDBInstance + rds:DescribeDBInstances）
#   - 対象 DB を recipe-board-db に限定（task-board-dev-db との誤爆防止）
#   - 冪等: 既に stopped なら no-op
#   - workflow_dispatch で手動テスト可能
#
# ユーザーの初期セットアップ（PR マージ後）:
#   1. IAM user 作成（github-actions-recipe-board-rds-stop など専用名）
#      最小権限ポリシー:
#        Effect: Allow
#        Action: [rds:StopDBInstance, rds:DescribeDBInstances]
#        Resource: arn:aws:rds:ap-northeast-1:*:db:recipe-board-db
#   2. AWS access key を発行
#   3. GitHub Secrets に登録:
#      - AWS_ACCESS_KEY_ID
#      - AWS_SECRET_ACCESS_KEY
#   4. Actions タブから workflow_dispatch で初回テスト
# ============================================

on:
  schedule:
    # 5 日ごと 00:00 UTC = 09:00 JST
    # 最大ギャップ 5〜6 日 < AWS 7 日自動再起動。安全マージン 1〜2 日。
    - cron: '0 0 */5 * *'
  workflow_dispatch:
    # 手動テスト / 緊急時用

permissions:
  contents: read

jobs:
  stop-rds:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-northeast-1

      - name: Check current RDS state
        id: check
        shell: bash
        run: |
          set -euo pipefail
          STATUS=$(aws rds describe-db-instances \
            --db-instance-identifier recipe-board-db \
            --query 'DBInstances[0].DBInstanceStatus' \
            --output text)
          echo "Current status: $STATUS"
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"

      - name: Stop RDS if running
        if: steps.check.outputs.status == 'available'
        shell: bash
        run: |
          echo "🛑 RDS recipe-board-db is running (available) — issuing stop"
          aws rds stop-db-instance \
            --db-instance-identifier recipe-board-db
          echo "✅ Stop requested"

      - name: Skip (already not running)
        if: steps.check.outputs.status != 'available'
        shell: bash
        env:
          STATUS: ${{ steps.check.outputs.status }}
        run: |
          echo "✅ RDS recipe-board-db state = '$STATUS' (not running) — no action needed"
          echo "::notice::修練城整備 #4: RDS already stopped/stopping. Idempotent no-op."

      - name: Heartbeat log
        shell: bash
        run: |
          echo "::notice::🟢 recipe-board RDS Auto Stop workflow completed at $(date -u)"
          echo "Next run: every 5 days via cron '0 0 */5 * *' (UTC) = 09:00 JST"
